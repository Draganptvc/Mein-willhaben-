name: Willhaben Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v3

      - name: Podesi Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instaliraj biblioteke
        run: pip install requests

      - name: Pokreni skriptu
        run: python main.py
concurrency:
